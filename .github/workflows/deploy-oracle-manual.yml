name: Deploy Oracle (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
      app_dir:
        description: "Remote app directory"
        required: true
        default: "/opt/himefit"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/panel-v2 ci
          npm --prefix apps/landing ci
          npm --prefix apps/server ci

      - name: Validate tests and builds
        run: |
          npm --prefix apps/panel-v2 run test
          node --test apps/server/tests/security.test.js apps/server/tests/admin_flows.test.js
          npm --prefix apps/panel-v2 run build
          npm --prefix apps/landing run build

      - name: Check required SSH secrets
        id: secrets_check
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
        run: |
          ORACLE_SSH_HOST="$(echo "$ORACLE_SSH_HOST" | tr -d '[:space:]')"
          ORACLE_SSH_USER="$(echo "$ORACLE_SSH_USER" | tr -d '[:space:]')"
          ORACLE_SSH_PORT="$(echo "$ORACLE_SSH_PORT" | tr -d '[:space:]')"

          missing=()
          [ -z "$ORACLE_SSH_PRIVATE_KEY" ] && missing+=("ORACLE_SSH_PRIVATE_KEY")
          [ -z "$ORACLE_SSH_HOST" ] && missing+=("ORACLE_SSH_HOST")
          [ -z "$ORACLE_SSH_USER" ] && missing+=("ORACLE_SSH_USER")
          [ -z "$ORACLE_SSH_PORT" ] && missing+=("ORACLE_SSH_PORT")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          if ! [[ "$ORACLE_SSH_PORT" =~ ^[0-9]+$ ]] || [ "$ORACLE_SSH_PORT" -lt 1 ] || [ "$ORACLE_SSH_PORT" -gt 65535 ]; then
            echo "::error::Invalid ORACLE_SSH_PORT"
            exit 1
          fi
          echo "ssh_host=$ORACLE_SSH_HOST" >> "$GITHUB_OUTPUT"
          echo "ssh_user=$ORACLE_SSH_USER" >> "$GITHUB_OUTPUT"
          echo "ssh_port=$ORACLE_SSH_PORT" >> "$GITHUB_OUTPUT"

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

      - name: Check SSH reachability
        env:
          ORACLE_SSH_HOST: ${{ steps.secrets_check.outputs.ssh_host }}
          ORACLE_SSH_PORT: ${{ steps.secrets_check.outputs.ssh_port }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if timeout 5 bash -lc "cat < /dev/null > /dev/tcp/${ORACLE_SSH_HOST}/${ORACLE_SSH_PORT}" 2>/dev/null; then
              echo "SSH endpoint reachable on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: SSH endpoint not reachable yet, waiting 10s..."
            sleep 10
          done
          echo "::error::Cannot reach ${ORACLE_SSH_HOST}:${ORACLE_SSH_PORT} from GitHub runner. Check GCP firewall tcp:22 and VM public IP."
          exit 1

      - name: Run remote deploy
        env:
          ASAAS_ENV: ${{ secrets.ASAAS_ENV }}
          ASAAS_API_KEY: ${{ secrets.ASAAS_API_KEY }}
          ASAAS_WEBHOOK_TOKEN: ${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          ASAAS_BASE_URL: ${{ secrets.ASAAS_BASE_URL }}
          PIX_EXPIRES_HOURS: ${{ secrets.PIX_EXPIRES_HOURS }}
        run: |
          for attempt in 1 2 3 4; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ConnectionAttempts=3 -p "${{ steps.secrets_check.outputs.ssh_port }}" "${{ steps.secrets_check.outputs.ssh_user }}@${{ steps.secrets_check.outputs.ssh_host }}" "\
              set -euo pipefail; \
              cd '${{ inputs.app_dir }}'; \
              export BRANCH='${{ inputs.branch }}'; \
              export ASAAS_ENV='${ASAAS_ENV}'; \
              export ASAAS_API_KEY='${ASAAS_API_KEY}'; \
              export ASAAS_WEBHOOK_TOKEN='${ASAAS_WEBHOOK_TOKEN}'; \
              export ASAAS_BASE_URL='${ASAAS_BASE_URL}'; \
              export PIX_EXPIRES_HOURS='${PIX_EXPIRES_HOURS}'; \
              bash tools/deploy/update-server.sh"; then
              echo "Remote deploy succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt} failed; waiting 15s before retry..."
            sleep 15
          done
          echo "::error::Remote deploy failed after retries."
          exit 1
