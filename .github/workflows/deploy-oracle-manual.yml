name: Deploy Oracle (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
      app_dir:
        description: "Remote app directory"
        required: true
        default: "/opt/himefit"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/panel-v2 ci
          npm --prefix apps/landing ci
          npm --prefix apps/server ci

      - name: Validate tests and builds
        run: |
          npm --prefix apps/panel-v2 run test
          node --test apps/server/tests/security.test.js apps/server/tests/admin_flows.test.js
          npm --prefix apps/panel-v2 run build
          npm --prefix apps/landing run build

      - name: Check required SSH secrets
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
        run: |
          missing=()
          [ -z "$ORACLE_SSH_PRIVATE_KEY" ] && missing+=("ORACLE_SSH_PRIVATE_KEY")
          [ -z "$ORACLE_SSH_HOST" ] && missing+=("ORACLE_SSH_HOST")
          [ -z "$ORACLE_SSH_USER" ] && missing+=("ORACLE_SSH_USER")
          [ -z "$ORACLE_SSH_PORT" ] && missing+=("ORACLE_SSH_PORT")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          if ! [[ "$ORACLE_SSH_PORT" =~ ^[0-9]+$ ]] || [ "$ORACLE_SSH_PORT" -lt 1 ] || [ "$ORACLE_SSH_PORT" -gt 65535 ]; then
            echo "::error::Invalid ORACLE_SSH_PORT"
            exit 1
          fi

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

      - name: Check SSH reachability
        env:
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if timeout 5 bash -lc "cat < /dev/null > /dev/tcp/${ORACLE_SSH_HOST}/${ORACLE_SSH_PORT}" 2>/dev/null; then
              echo "SSH endpoint reachable on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: SSH endpoint not reachable yet, waiting 10s..."
            sleep 10
          done
          echo "::error::Cannot reach ${ORACLE_SSH_HOST}:${ORACLE_SSH_PORT} from GitHub runner. Check GCP firewall tcp:22 and VM public IP."
          exit 1

      - name: Run remote deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p "${{ secrets.ORACLE_SSH_PORT }}" "${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}" "\
            set -euo pipefail; \
            cd '${{ inputs.app_dir }}'; \
            export BRANCH='${{ inputs.branch }}'; \
            bash tools/deploy/update-server.sh"
