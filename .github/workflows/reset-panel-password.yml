name: Reset Panel Password

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Usuario do painel"
        required: true
        default: "admin"
      password:
        description: "Nova senha forte"
        required: true
      app_dir:
        description: "Diretorio remoto da aplicacao"
        required: true
        default: "/opt/himefit"

jobs:
  reset:
    runs-on: [self-hosted, linux, x64, himefit-prod]
    timeout-minutes: 10

    steps:
      - name: Reset password in production DB
        env:
          APP_DIR: ${{ inputs.app_dir }}
          PANEL_RESET_USER: ${{ inputs.username }}
          PANEL_RESET_PASS: ${{ inputs.password }}
          HIMEFIT_TENANT_SLUG: academia-oxigenio
          HIMEFIT_TENANT_NAME: Academia Oxigenio
          HIMEFIT_DATA_ROOT: /opt/himefit/runtime
        run: |
          set -euo pipefail
          echo "::add-mask::${PANEL_RESET_PASS}"
          cd "$APP_DIR"
          node apps/server/scripts/reset_panel_password.js
