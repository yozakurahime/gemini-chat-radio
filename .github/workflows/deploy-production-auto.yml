name: Deploy Production (Auto)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
      app_dir:
        description: "Remote app directory"
        required: true
        default: "/opt/himefit"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, linux, x64, himefit-prod]
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "app_dir=${{ inputs.app_dir }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "app_dir=/opt/himefit" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deploy ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Validate target app dir
        env:
          APP_DIR: ${{ steps.target.outputs.app_dir }}
        run: |
          if [ -z "$APP_DIR" ]; then
            echo "::error::app_dir is empty"
            exit 1
          fi
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::App directory not found: $APP_DIR"
            exit 1
          fi

      - name: Run remote update
        env:
          APP_DIR: ${{ steps.target.outputs.app_dir }}
          BRANCH: ${{ steps.target.outputs.branch }}
          RUN_TESTS_ON_SERVER: "0"
          NPM_TIMEOUT_SEC: "2400"
        run: |
          bash tools/deploy/update-server.sh
