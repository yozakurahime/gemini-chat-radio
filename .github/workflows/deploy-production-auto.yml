name: Deploy Production (Auto)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "main"
      app_dir:
        description: "Remote app directory"
        required: true
        default: "/opt/himefit"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve deploy target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"
            echo "app_dir=${{ inputs.app_dir }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
            echo "app_dir=/opt/himefit" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout deploy ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}

      - name: Check required SSH secrets
        id: secrets_check
        env:
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
          ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
          ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT }}
        run: |
          ORACLE_SSH_HOST="$(echo "$ORACLE_SSH_HOST" | tr -d '[:space:]')"
          ORACLE_SSH_USER="$(echo "$ORACLE_SSH_USER" | tr -d '[:space:]')"
          ORACLE_SSH_PORT="$(echo "$ORACLE_SSH_PORT" | tr -d '[:space:]')"

          missing=()
          [ -z "$ORACLE_SSH_PRIVATE_KEY" ] && missing+=("ORACLE_SSH_PRIVATE_KEY")
          [ -z "$ORACLE_SSH_HOST" ] && missing+=("ORACLE_SSH_HOST")
          [ -z "$ORACLE_SSH_USER" ] && missing+=("ORACLE_SSH_USER")
          [ -z "$ORACLE_SSH_PORT" ] && missing+=("ORACLE_SSH_PORT")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy skipped: missing secrets -> ${missing[*]}"
          elif ! [[ "$ORACLE_SSH_PORT" =~ ^[0-9]+$ ]] || [ "$ORACLE_SSH_PORT" -lt 1 ] || [ "$ORACLE_SSH_PORT" -gt 65535 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy skipped: ORACLE_SSH_PORT is invalid"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "ssh_host=$ORACLE_SSH_HOST" >> "$GITHUB_OUTPUT"
            echo "ssh_user=$ORACLE_SSH_USER" >> "$GITHUB_OUTPUT"
            echo "ssh_port=$ORACLE_SSH_PORT" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        if: steps.secrets_check.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}

      - name: Check SSH reachability
        if: steps.secrets_check.outputs.ready == 'true'
        env:
          ORACLE_SSH_HOST: ${{ steps.secrets_check.outputs.ssh_host }}
          ORACLE_SSH_PORT: ${{ steps.secrets_check.outputs.ssh_port }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if timeout 5 bash -lc "cat < /dev/null > /dev/tcp/${ORACLE_SSH_HOST}/${ORACLE_SSH_PORT}" 2>/dev/null; then
              echo "SSH endpoint reachable on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt}: SSH endpoint not reachable yet, waiting 10s..."
            sleep 10
          done
          echo "::error::Cannot reach ${ORACLE_SSH_HOST}:${ORACLE_SSH_PORT} from GitHub runner. Check GCP firewall tcp:22 and VM public IP."
          exit 1

      - name: Run remote update
        if: steps.secrets_check.outputs.ready == 'true'
        run: |
          for attempt in 1 2 3 4; do
            if ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -o ConnectionAttempts=3 -p "${{ steps.secrets_check.outputs.ssh_port }}" "${{ steps.secrets_check.outputs.ssh_user }}@${{ steps.secrets_check.outputs.ssh_host }}" "\
              set -euo pipefail; \
              cd '${{ steps.target.outputs.app_dir }}'; \
              export BRANCH='${{ steps.target.outputs.branch }}'; \
              bash tools/deploy/update-server.sh"; then
              echo "Remote update succeeded on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt} failed; waiting 15s before retry..."
            sleep 15
          done
          echo "::error::Remote update failed after retries."
          exit 1
